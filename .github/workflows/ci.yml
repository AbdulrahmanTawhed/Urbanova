name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Integration tests override this per-run; the default below serves local SQL Server.
  ConnectionStrings__UrbanovaDb: "Server=(localdb)\\MSSQLLocalDB;Database=Urbanova_Test;Trusted_Connection=True;TrustServerCertificate=True"
  Jwt__Key: "ci-only-test-key-0123456789abcdef"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Urbanova.slnx

      - name: Build
        run: dotnet build Urbanova.slnx --no-restore --nologo -v minimal

      - name: Unit tests
        run: dotnet test tests/Urbanova.UnitTests --no-build --nologo -v minimal

      # Integration tests need SQL Server. GitHub-hosted runners cannot use LocalDB,
      # so point ConnectionStrings__UrbanovaDb at a real instance. Example with a
      # service container (uncomment + adapt):
      #
      # services:
      #   sqlserver:
      #     image: mcr.microsoft.com/mssql/server:2022-latest
      #     env:
      #       SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
      #       ACCEPT_EULA: "Y"
      #     ports:
      #       - 1433:1433
      #
      # Then run integration tests with:
      #   ConnectionStrings__UrbanovaDb: "Server=localhost,1433;Database=Urbanova_Test;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD }};TrustServerCertificate=True"
      - name: Integration tests (LocalDB on windows-latest)
        run: dotnet test tests/Urbanova.IntegrationTests --no-build --nologo -v minimal
